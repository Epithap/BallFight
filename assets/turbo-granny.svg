<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lilita+One&amp;display=swap');

      .bg-circle { fill: #fbf5e6; stroke: #2b1b3d; stroke-width: 8; }

      @keyframes floatGranny {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      @keyframes coinSwing {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(12deg); }
      }

      @keyframes bellSwing {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(10deg); }
      }

      @keyframes blinkEyes {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }

      .anim-float { animation: floatGranny 2.8s ease-in-out infinite; }
      .anim-coin { animation: coinSwing 2.1s ease-in-out infinite; transform-origin: 218px 236px; }
      .anim-bell { animation: bellSwing 2.1s ease-in-out infinite; transform-origin: 160px 250px; }
      .anim-eyes { animation: blinkEyes 3.6s ease-in-out infinite; transform-origin: 160px 150px; }
    </style>
  </defs>

  <!-- Outer Circular Card -->
  <circle cx="160" cy="160" r="150" class="bg-circle" />
  <circle cx="160" cy="160" r="138" fill="none" stroke="#2b1b3d" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Ground shadow -->
  <ellipse cx="160" cy="274" rx="76" ry="12" fill="rgba(43,27,61,0.22)" />

  <g class="anim-float">
    <!-- Pointed Cat Ears with Vermilion Lining -->
    <polygon points="88,108 90,26 146,72" fill="#ffffff" stroke="#2b1b3d" stroke-width="7" stroke-linejoin="round" />
    <polygon points="98,92 100,46 128,74" fill="#e8472b" stroke="#2b1b3d" stroke-width="4.5" stroke-linejoin="round" />

    <polygon points="232,108 230,26 174,72" fill="#ffffff" stroke="#2b1b3d" stroke-width="7" stroke-linejoin="round" />
    <polygon points="222,92 220,46 192,74" fill="#e8472b" stroke="#2b1b3d" stroke-width="4.5" stroke-linejoin="round" />

    <!-- White Ball Body -->
    <circle cx="160" cy="166" r="94" fill="#ffffff" stroke="#2b1b3d" stroke-width="8" />

    <!-- Crimson Forehead Patch with Gloss -->
    <ellipse cx="160" cy="90" rx="19" ry="14" fill="#d92b2b" stroke="#2b1b3d" stroke-width="5.5" />
    <circle cx="153" cy="86" r="3.5" fill="#ffffff" />

    <!-- Pink Blushing Cheeks -->
    <ellipse cx="106" cy="186" rx="16" ry="9.5" fill="#ffb3b8" />
    <ellipse cx="214" cy="186" rx="16" ry="9.5" fill="#ffb3b8" />

    <!-- Furrowed Brow Glare -->
    <line x1="112" y1="128" x2="148" y2="142" stroke="#2b1b3d" stroke-width="8.5" stroke-linecap="round" />
    <line x1="208" y1="128" x2="172" y2="142" stroke="#2b1b3d" stroke-width="8.5" stroke-linecap="round" />

    <!-- Almond Eyes with Golden Iris, Slit Pupil & Upper Lashes -->
    <g class="anim-eyes">
      <!-- Left Eye -->
      <path d="M111,155 Q130,132 149,155 Q130,171 111,155 Z" fill="#ffffff" stroke="#2b1b3d" stroke-width="5.5" stroke-linejoin="round" />
      <circle cx="130" cy="154" r="10.5" fill="#f5b81c" />
      <ellipse cx="130" cy="154" rx="3.4" ry="8.8" fill="#2b1b3d" />
      <line x1="111" y1="155" x2="103" y2="147" stroke="#2b1b3d" stroke-width="4.5" stroke-linecap="round" />
      <line x1="117" y1="146" x2="110" y2="138" stroke="#2b1b3d" stroke-width="4.5" stroke-linecap="round" />

      <!-- Right Eye -->
      <path d="M171,155 Q190,132 209,155 Q190,171 171,155 Z" fill="#ffffff" stroke="#2b1b3d" stroke-width="5.5" stroke-linejoin="round" />
      <circle cx="190" cy="154" r="10.5" fill="#f5b81c" />
      <ellipse cx="190" cy="154" rx="3.4" ry="8.8" fill="#2b1b3d" />
      <line x1="209" y1="155" x2="217" y2="147" stroke="#2b1b3d" stroke-width="4.5" stroke-linecap="round" />
      <line x1="203" y1="146" x2="210" y2="138" stroke="#2b1b3d" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Pink Nose & Wavy 'ω' Mouth -->
    <polygon points="153,170 167,170 160,179" fill="#ff6b81" stroke="#2b1b3d" stroke-width="4" stroke-linejoin="round" />
    <path d="M138,187 Q149,198 160,185 Q171,198 182,187" fill="none" stroke="#2b1b3d" stroke-width="5.5" stroke-linecap="round" />

    <!-- Whiskers -->
    <g stroke="#2b1b3d" stroke-width="4.2" stroke-linecap="round">
      <line x1="90" y1="171" x2="54" y2="163" />
      <line x1="90" y1="181" x2="54" y2="187" />
      <line x1="93" y1="192" x2="60" y2="207" />
      <line x1="230" y1="171" x2="266" y2="163" />
      <line x1="230" y1="181" x2="266" y2="187" />
      <line x1="227" y1="192" x2="260" y2="207" />
    </g>

    <!-- Red Collar -->
    <path d="M84,221 A94,94 0 0,0 236,221" fill="none" stroke="#2b1b3d" stroke-width="20" stroke-linecap="round" />
    <path d="M84,221 A94,94 0 0,0 236,221" fill="none" stroke="#e0262c" stroke-width="11.5" stroke-linecap="round" />

    <!-- 5-Scallop Green Bib -->
    <g fill="#2fbf71" stroke="#2b1b3d" stroke-width="4.5" stroke-linejoin="round">
      <path d="M114,240 A10,10 0 0,0 134,240 Z" />
      <path d="M132,248 A10,10 0 0,0 152,248 Z" />
      <path d="M150,252 A10,10 0 0,0 170,252 Z" />
      <path d="M168,248 A10,10 0 0,0 188,248 Z" />
      <path d="M186,240 A10,10 0 0,0 206,240 Z" />
    </g>

    <!-- Golden Jingle Bell -->
    <g class="anim-bell">
      <circle cx="160" cy="264" r="12" fill="#ffc93c" stroke="#2b1b3d" stroke-width="4.5" />
      <line x1="150" y1="266" x2="170" y2="266" stroke="#2b1b3d" stroke-width="4" stroke-linecap="round" />
      <circle cx="160" cy="271" r="2.6" fill="#2b1b3d" />
    </g>

    <!-- Swinging Golden Koban Coin "千万" -->
    <g class="anim-coin">
      <line x1="218" y1="234" x2="218" y2="248" stroke="#2b1b3d" stroke-width="4" stroke-linecap="round" />
      <ellipse cx="218" cy="267" rx="15" ry="20" fill="#ffc93c" stroke="#2b1b3d" stroke-width="5" />
      <text x="218" y="261" font-family="sans-serif" font-weight="900" font-size="12" fill="#2b1b3d" text-anchor="middle" dominant-baseline="central">千</text>
      <text x="218" y="275" font-family="sans-serif" font-weight="900" font-size="12" fill="#2b1b3d" text-anchor="middle" dominant-baseline="central">万</text>
    </g>
  </g>

  <!-- Mascot Bottom Ribbon -->
  <g transform="translate(160, 296)">
    <rect x="-86" y="-17" width="172" height="30" rx="15" fill="#2b1b3d" />
    <rect x="-86" y="-20" width="172" height="30" rx="15" fill="#ffc93c" stroke="#2b1b3d" stroke-width="4" />
    <text x="0" y="0" font-family="'Lilita One', sans-serif" font-size="16" fill="#2b1b3d" text-anchor="middle" letter-spacing="1">TURBO GRANNY</text>
  </g>
</svg>
