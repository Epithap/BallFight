    <!-- Clenched Haki Rubber Fist -->
    <ellipse cx="154" cy="122" rx="14" ry="12" fill="#2b1b3d" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="152" cy="120" r="4" fill="#ffffff" opacity="0.3" />
    <line x1="130" y1="126" x2="142" y2="124" stroke="#ff4757" stroke-width="6" stroke-linecap="round" />

    <!-- Luffy Ball Body -->
    <circle cx="100" cy="112" r="36" fill="#ff4757" stroke="#2b1b3d" stroke-width="4.5" />
    <!-- Skin-tone Face -->
    <path d="M 68 112 A 32 32 0 0 1 132 112 Q 100 138 68 112 Z" fill="#ffdfba" />
    
    <!-- Straw Hat (Brim, Crown & Red Ribbon) -->
    <ellipse cx="100" cy="86" rx="44" ry="12" fill="#fed330" stroke="#2b1b3d" stroke-width="4" />
    <path d="M 72 84 Q 100 58 128 84 Z" fill="#fed330" stroke="#2b1b3d" stroke-width="3.5" />
    <path d="M 72 84 Q 100 76 128 84" fill="none" stroke="#eb2f06" stroke-width="6" />

    <!-- Hair Tufts under hat -->
    <polygon points="68,92 60,102 74,98" fill="#2b1b3d" />
    <polygon points="132,92 140,102 126,98" fill="#2b1b3d" />

    <!-- Eyes -->
    <ellipse cx="88" cy="108" rx="5" ry="7" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="89" cy="109" r="2.8" fill="#2b1b3d" />
    <ellipse cx="112" cy="108" rx="5" ry="7" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="113" cy="109" r="2.8" fill="#2b1b3d" />
    
    <!-- Scar under left eye -->
    <path d="M 85 117 Q 88 119 91 117" fill="none" stroke="#2b1b3d" stroke-width="1.8" />
    <line x1="88" y1="116" x2="88" y2="120" stroke="#2b1b3d" stroke-width="1.8" />

    <!-- Giant D-Shaped Toothy Smile -->
    <path d="M 86 122 Q 100 140 114 122 Z" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.8" />
    <line x1="86" y1="126" x2="114" y2="126" stroke="#2b1b3d" stroke-width="1.5" />
    <line x1="100" y1="122" x2="100" y2="132" stroke="#2b1b3d" stroke-width="1.5" />

    <!-- Skill & Ult Badges -->
    <rect x="14" y="176" width="172" height="26" rx="13" fill="#eb2f06" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="193" text-anchor="middle" class="font-pill" fill="#ffffff">🥊 SKILL : GUM-GUM ROCKET</text>
    
    <rect x="14" y="208" width="172" height="24" rx="12" fill="#b71540" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="224" text-anchor="middle" class="font-pill" fill="#ffffff">👑 ULT : GEAR 4 BOUNCE-MAN</text>
  </g>

  <!-- CARD 4: ICHIGO (SUBSTITUTE REAPER) -->
  <g transform="translate(734, 112)" class="brawler-card">
    <rect x="3" y="4" width="200" height="246" rx="20" class="card-shadow" />
    <rect x="0" y="0" width="200" height="246" rx="20" fill="#f8f9fa" stroke="#2b1b3d" stroke-width="4" />
    
    <!-- Top Role Tag -->
    <rect x="18" y="12" width="164" height="22" rx="11" fill="#2f3542" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="27" text-anchor="middle" class="font-sub" font-size="11" fill="#ffffff" letter-spacing="1">SUBSTITUTE REAPER</text>

    <!-- Character Pedestal Shadow -->
    <ellipse cx="100" cy="148" rx="42" ry="10" fill="#2b1b3d" opacity="0.22" />

    <!-- Tensa Zangetsu Greatsword (Black Blade with Chain) -->
    <line x1="48" y1="168" x2="162" y2="48" stroke="#2f3542" stroke-width="7" stroke-linecap="square" />
    <line x1="48" y1="168" x2="162" y2="48" stroke="#2b1b3d" stroke-width="2" stroke-linecap="square" />
    <line x1="50" y1="166" x2="160" y2="50" stroke="#ffffff" stroke-width="1.8" />
    <!-- Tsuba & Grip -->
    <rect x="58" y="152" width="14" height="6" fill="#2b1b3d" transform="rotate(-45 65 155)" />

    <!-- Ichigo Ball Body (Black Shihakusho) -->
    <circle cx="100" cy="112" r="36" fill="#2f3542" stroke="#2b1b3d" stroke-width="4.5" />
    <!-- Skin-tone Face -->
    <path d="M 68 112 A 32 32 0 0 1 132 112 Q 100 138 68 112 Z" fill="#ffdfba" />
    <!-- Spiky Bright Orange Hair -->
    <path d="M 66 94 L 46 72 L 72 78 L 84 54 L 98 76 L 116 52 L 124 76 L 150 72 L 134 94 Z" fill="#ff793f" stroke="#2b1b3d" stroke-width="3" />
    
    <!-- Fierce Angled Eyes -->
    <polygon points="82,106 94,103 93,112 83,111" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.2" />
    <circle cx="89" cy="108" r="2.8" fill="#7158e2" />
    <polygon points="118,106 106,103 107,112 117,111" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.2" />
    <circle cx="111" cy="108" r="2.8" fill="#7158e2" />

    <!-- Determined Mouth Line -->
    <line x1="94" y1="124" x2="106" y2="124" stroke="#2b1b3d" stroke-width="3" stroke-linecap="round" />

    <!-- White Shihakusho Collar V-Neck -->
    <polygon points="94,132 106,132 100,142" fill="#ffffff" stroke="#2b1b3d" stroke-width="2" />

    <!-- Skill & Ult Badges -->
    <rect x="14" y="176" width="172" height="26" rx="13" fill="#3742fa" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="193" text-anchor="middle" class="font-pill" fill="#ffffff">⚔️ SKILL : GETSUGA TENSHO</text>
    
    <rect x="14" y="208" width="172" height="24" rx="12" fill="#2f3542" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="224" text-anchor="middle" class="font-pill" fill="#ffffff">💀 ULT : HOLLOW MASK BANKAI</text>
  </g>
</svg>