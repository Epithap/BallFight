<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="390">
  <defs>
    <style>
      .bg-main { fill: #ffbe0b; stroke: #2b1b3d; stroke-width: 6; rx: 24; }
      .bg-inner-border { fill: none; stroke: #2b1b3d; stroke-width: 3; stroke-dasharray: 8 6; rx: 18; }
      .dot-bg { fill: #f39c12; opacity: 0.28; }
      
      .card-bg { fill: #ffffff; stroke: #2b1b3d; stroke-width: 4; rx: 18; }
      .card-shadow { fill: #2b1b3d; opacity: 0.18; }
      
      .font-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-pill { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 10px; }
      
      /* Pure CSS safe hover bounce */
      .brawler-card { transition: transform 0.2s ease; }
      .brawler-card:hover { transform: translateY(-4px); }
    </style>
  </defs>

  <!-- Main Background Container -->
  <rect x="8" y="8" width="984" height="374" class="bg-main" />
  <rect x="18" y="18" width="964" height="354" class="bg-inner-border" />

  <!-- Comic Background Dot Grid -->
  <g class="dot-bg">
    <circle cx="45" cy="45" r="3.5" /><circle cx="85" cy="45" r="3.5" /><circle cx="125" cy="45" r="3.5" /><circle cx="875" cy="45" r="3.5" /><circle cx="915" cy="45" r="3.5" /><circle cx="955" cy="45" r="3.5" />
    <circle cx="45" cy="85" r="3.5" /><circle cx="85" cy="85" r="3.5" /><circle cx="125" cy="85" r="3.5" /><circle cx="875" cy="85" r="3.5" /><circle cx="915" cy="85" r="3.5" /><circle cx="955" cy="85" r="3.5" />
    <circle cx="45" cy="345" r="3.5" /><circle cx="85" cy="345" r="3.5" /><circle cx="125" cy="345" r="3.5" /><circle cx="875" cy="345" r="3.5" /><circle cx="915" cy="345" r="3.5" /><circle cx="955" cy="345" r="3.5" />
  </g>

  <!-- ================= TOP HEADER BANNER ================= -->
  <!-- Shadow of Main Header -->
  <rect x="233" y="23" width="534" height="48" rx="24" fill="#2b1b3d" />
  <!-- Main Header Pill -->
  <rect x="230" y="20" width="540" height="48" rx="24" fill="#ff4757" stroke="#2b1b3d" stroke-width="4" />
  <text x="500" y="53" text-anchor="middle" class="font-title" font-size="25" fill="#ffffff" letter-spacing="2">BALL FIGHT : ANIME PHYSICS ARENA</text>

  <!-- Subtitle Pill -->
  <rect x="330" y="74" width="340" height="24" rx="12" fill="#2b1b3d" />
  <text x="500" y="90" text-anchor="middle" class="font-sub" font-size="11" fill="#ffd32a" letter-spacing="1.5">★ 4 FIGHTERS • 60 FPS BRAWLER • ZERO DEPS ★</text>

  <!-- Mascot Turbo Granny Mini Badge (Top Right) -->
  <g transform="translate(855, 52)">
    <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#2b1b3d" stroke-width="3.5" />
    <!-- Ears -->
    <polygon points="-12,-16 -20,-34 -4,-22" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <polygon points="-11,-18 -18,-30 -6,-22" fill="#c91d24" />
    <polygon points="12,-16 20,-34 4,-22" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <polygon points="11,-18 18,-30 6,-22" fill="#c91d24" />
    <!-- Red Forehead Patch -->
    <ellipse cx="0" cy="-22" rx="7" ry="4" fill="#99181e" stroke="#2b1b3d" stroke-width="1.8" />
    <!-- Eyes with eyelashes -->
    <ellipse cx="-8" cy="-2" rx="5.5" ry="4.5" fill="#ffffff" stroke="#2b1b3d" stroke-width="2" />
    <ellipse cx="-8" cy="-1.5" rx="3.5" ry="3.5" fill="#202028" />
    <ellipse cx="8" cy="-2" rx="5.5" ry="4.5" fill="#ffffff" stroke="#2b1b3d" stroke-width="2" />
    <ellipse cx="8" cy="-1.5" rx="3.5" ry="3.5" fill="#202028" />
    <!-- Whiskers & Mouth -->
    <line x1="-12" y1="3" x2="-22" y2="1" stroke="#2b1b3d" stroke-width="1.8" />
    <line x1="-12" y1="6" x2="-22" y2="7" stroke="#2b1b3d" stroke-width="1.8" />
    <line x1="12" y1="3" x2="22" y2="1" stroke="#2b1b3d" stroke-width="1.8" />
    <line x1="12" y1="6" x2="22" y2="7" stroke="#2b1b3d" stroke-width="1.8" />
    <path d="M-5 5 Q-2.5 8 0 5 Q2.5 8 5 5" fill="none" stroke="#2b1b3d" stroke-width="2" />
    <!-- Koban Coin -->
    <ellipse cx="0" cy="27" rx="8" ry="10" fill="#f39c12" stroke="#2b1b3d" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="6.5" fill="#1b1b1f">千</text>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="6.5" fill="#1b1b1f">万</text>
    <!-- Tag -->
    <rect x="-42" y="38" width="84" height="15" rx="7.5" fill="#2b1b3d" />
    <text x="0" y="49" text-anchor="middle" class="font-sub" font-size="8" fill="#ffffff">TURBO GRANNY</text>
  </g>

  <!-- ================= 4 BRAWLER SHOWCASE CARDS ================= -->

  <!-- CARD 1: GOKU (STRONGEST ALIEN) -->
  <g transform="translate(68, 112)" class="brawler-card">
    <rect x="3" y="4" width="200" height="246" rx="20" class="card-shadow" />
    <rect x="0" y="0" width="200" height="246" rx="20" fill="#fff7ed" stroke="#2b1b3d" stroke-width="4" />
    
    <!-- Top Role Tag -->
    <rect x="18" y="12" width="164" height="22" rx="11" fill="#ff4757" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="27" text-anchor="middle" class="font-sub" font-size="11" fill="#ffffff" letter-spacing="1">STRONGEST ALIEN</text>

    <!-- Character Pedestal Shadow -->
    <ellipse cx="100" cy="148" rx="42" ry="10" fill="#2b1b3d" opacity="0.22" />

    <!-- Power Pole (Nyoibo) -->
    <line x1="42" y1="168" x2="160" y2="50" stroke="#ff3838" stroke-width="7" stroke-linecap="round" />
    <line x1="42" y1="168" x2="160" y2="50" stroke="#2b1b3d" stroke-width="2.2" stroke-linecap="round" />
    <rect x="144" y="60" width="12" height="6" rx="2" fill="#ffd32a" stroke="#2b1b3d" stroke-width="1.8" transform="rotate(-45 150 63)" />
    <rect x="52" y="152" width="12" height="6" rx="2" fill="#ffd32a" stroke="#2b1b3d" stroke-width="1.8" transform="rotate(-45 58 155)" />

    <!-- Goku Ball Body -->
    <circle cx="100" cy="112" r="36" fill="#ff793f" stroke="#2b1b3d" stroke-width="4.5" />
    <!-- Skin-tone Face -->
    <path d="M 68 112 A 32 32 0 0 1 132 112 Q 100 138 68 112 Z" fill="#ffdfba" />
    <!-- Spiky Black Hair -->
    <path d="M 66 94 L 48 72 L 72 78 L 84 56 L 98 78 L 118 54 L 122 78 L 148 72 L 132 94 Z" fill="#2b1b3d" />
    <!-- Eyes -->
    <ellipse cx="88" cy="108" rx="6" ry="8" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="89" cy="109" r="3.2" fill="#2b1b3d" />
    <circle cx="87" cy="107" r="1.2" fill="#ffffff" />
    <ellipse cx="112" cy="108" rx="6" ry="8" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="113" cy="109" r="3.2" fill="#2b1b3d" />
    <circle cx="111" cy="107" r="1.2" fill="#ffffff" />
    <!-- Smirk -->
    <path d="M 94 122 Q 100 128 106 122" fill="none" stroke="#2b1b3d" stroke-width="3" stroke-linecap="round" />
    <!-- Blue Gi Neck & Kanji Badge -->
    <polygon points="92,132 108,132 100,144" fill="#1e90ff" stroke="#2b1b3d" stroke-width="2" />
    <circle cx="118" cy="132" r="7" fill="#ffffff" stroke="#2b1b3d" stroke-width="1.8" />
    <text x="118" y="135" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="8" fill="#2b1b3d">亀</text>

    <!-- Skill & Ult Badges -->
    <rect x="14" y="176" width="172" height="26" rx="13" fill="#2ed573" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="193" text-anchor="middle" class="font-pill" fill="#ffffff">⚡ SKILL : KAMEHAMEHA</text>
    
    <rect x="14" y="208" width="172" height="24" rx="12" fill="#ff4757" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="224" text-anchor="middle" class="font-pill" fill="#ffffff">🔥 ULT : KAIOKEN BURST</text>
  </g>

  <!-- CARD 2: NARUTO (CHILD OF PROPHECY) -->
  <g transform="translate(290, 112)" class="brawler-card">
    <rect x="3" y="4" width="200" height="246" rx="20" class="card-shadow" />
    <rect x="0" y="0" width="200" height="246" rx="20" fill="#fffdf0" stroke="#2b1b3d" stroke-width="4" />
    
    <!-- Top Role Tag -->
    <rect x="18" y="12" width="164" height="22" rx="11" fill="#ffa502" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="27" text-anchor="middle" class="font-sub" font-size="11" fill="#ffffff" letter-spacing="1">CHILD OF PROPHECY</text>

