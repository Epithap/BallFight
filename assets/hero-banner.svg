    <circle cx="152" cy="98" r="11" fill="#1e90ff" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 144 98 Q 152 90 160 98" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 146 103 Q 152 108 158 103" fill="none" stroke="#ffffff" stroke-width="2" />

