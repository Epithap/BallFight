    <!-- Skin-tone Face -->
    <path d="M 68 112 A 32 32 0 0 1 132 112 Q 100 138 68 112 Z" fill="#ffdfba" />
    <!-- Spiky Blonde Hair -->
    <path d="M 66 94 L 50 72 L 74 78 L 86 54 L 98 76 L 114 54 L 122 78 L 148 72 L 134 94 Z" fill="#ffda79" stroke="#2b1b3d" stroke-width="3" />
    <!-- Headband -->
    <path d="M 68 98 Q 100 90 132 98" fill="none" stroke="#2b1b3d" stroke-width="11" />
    <rect x="88" y="88" width="24" height="12" rx="3" fill="#ced6e0" stroke="#2b1b3d" stroke-width="2" />
    <circle cx="100" cy="94" r="2.8" fill="#2b1b3d" />
    <!-- Eyes -->
    <ellipse cx="88" cy="112" rx="6" ry="7" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="89" cy="113" r="3" fill="#1e90ff" />
    <circle cx="87" cy="111" r="1" fill="#ffffff" />
    <ellipse cx="112" cy="112" rx="6" ry="7" fill="#ffffff" stroke="#2b1b3d" stroke-width="2.5" />
    <circle cx="113" cy="113" r="3" fill="#1e90ff" />
    <circle cx="111" cy="111" r="1" fill="#ffffff" />
    <!-- Whiskers -->
    <line x1="74" y1="113" x2="82" y2="114" stroke="#2b1b3d" stroke-width="2" />
    <line x1="74" y1="117" x2="82" y2="118" stroke="#2b1b3d" stroke-width="2" />
    <line x1="118" y1="114" x2="126" y2="113" stroke="#2b1b3d" stroke-width="2" />
    <line x1="118" y1="118" x2="126" y2="117" stroke="#2b1b3d" stroke-width="2" />
    <!-- Confident Grin -->
    <path d="M 94 125 Q 100 131 106 125" fill="none" stroke="#2b1b3d" stroke-width="3" stroke-linecap="round" />

    <!-- Skill & Ult Badges -->
    <rect x="14" y="176" width="172" height="26" rx="13" fill="#1e90ff" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="193" text-anchor="middle" class="font-pill" fill="#ffffff">🌀 SKILL : RASENGAN</text>
    
    <rect x="14" y="208" width="172" height="24" rx="12" fill="#70a1ff" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="224" text-anchor="middle" class="font-pill" fill="#2b1b3d">🌪️ ULT : RASENSHURIKEN</text>
  </g>

  <!-- CARD 3: LUFFY (WARRIOR OF LIBERATION) -->
  <g transform="translate(512, 112)" class="brawler-card">
    <rect x="3" y="4" width="200" height="246" rx="20" class="card-shadow" />
    <rect x="0" y="0" width="200" height="246" rx="20" fill="#fff2f2" stroke="#2b1b3d" stroke-width="4" />
    
    <!-- Top Role Tag -->
    <rect x="18" y="12" width="164" height="22" rx="11" fill="#eb2f06" stroke="#2b1b3d" stroke-width="2.5" />
    <text x="100" y="27" text-anchor="middle" class="font-sub" font-size="11" fill="#ffffff" letter-spacing="1">WARRIOR OF LIBERATION</text>

    <!-- Character Pedestal Shadow -->
